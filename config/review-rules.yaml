pr_rules:
  require_description: true
  min_description_length: 20
  max_changed_lines: 500
  max_changed_files: 40
  enforce_workspace_isolation: true

  dangerous_paths:
    - ".github/**"
    - ".gitea/**"
    - "docker-compose*.yml"
    - "Dockerfile*"
    - "infra/**"
    - "deploy/**"
    - "k8s/**"
    - "terraform/**"
    - ".env*"
    - "secrets/**"

  migration_paths:
    - "database/**"
    - "migrations/**"
    - "**/alembic/versions/**"
    - "**/*migration*"

  infrastructure_paths:
    - "infra/**"
    - "deploy/**"
    - "k8s/**"
    - "terraform/**"
    - "ansible/**"
    - "helm/**"
    - "docker/**"

  test_paths:
    - "tests/**"
    - "**/test_*.py"
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/*.spec.tsx"
    - "**/*.test.tsx"

  labels:
    frontend:
      paths:
        - "frontend/**"
        - "src/ui/**"
        - "apps/dashboard/**"
        - "packages/ui/**"
    backend:
      paths:
        - "backend/**"
        - "src/api/**"
        - "apps/api/**"
    database:
      paths:
        - "database/**"
        - "migrations/**"
        - "**/alembic/**"
    infrastructure:
      paths:
        - "infra/**"
        - "deploy/**"
        - "docker/**"
        - "k8s/**"
        - "terraform/**"
    tests:
      paths:
        - "tests/**"
        - "**/*.spec.ts"
        - "**/*.test.ts"
        - "**/test_*.py"

  reviewers:
    frontend:
      paths:
        - "frontend/**"
        - "src/ui/**"
        - "apps/dashboard/**"
      users:
        - "frontend-lead"
    backend:
      paths:
        - "backend/**"
        - "src/api/**"
        - "apps/api/**"
      users:
        - "backend-lead"
    database:
      paths:
        - "database/**"
        - "migrations/**"
      users:
        - "dba"

ai_review:
  enabled: true
  minimum_confidence: 0.75
  check:
    - defects introduced by the actual diff
    - broken behavior in the edited code
    - authentication problems in the changed lines
    - authorization problems in the changed lines
    - missing input validation in the changed lines
    - null handling in the changed lines
    - runtime errors caused by the change
    - breaking API changes in the diff
    - "workspace isolation: one app or one package only"
  ignore:
    - formatting
    - variable naming preferences
    - stylistic opinions
    - generated code
    - dependency lock files
    - whitespace
    - lint problems already covered by tooling
    - refactor suggestions
    - architecture rewrites
    - asking for extra files outside the diff
    - suggesting tests unless the changed code is already broken

path_rules:
  "apps/**":
    check:
      - files stay inside the same apps/<name> folder
      - no edits to other apps, packages, or repo-root files
      - the change does not break the edited app behavior
  "packages/**":
    check:
      - files stay inside the same packages/<name> folder
      - no edits to other packages, apps, or repo-root files
      - the change does not break the edited package behavior
  "auth/**":
    check:
      - authentication bypass
      - token validation
      - authorization
      - permission checking
      - session handling
  "**/auth/**":
    check:
      - authentication bypass
      - token validation
      - authorization
      - permission checking
      - session handling
  "database/**":
    check:
      - unsafe queries
      - transaction handling
      - migration safety
      - rollback safety
  "**/migrations/**":
    check:
      - unsafe queries
      - transaction handling
      - migration safety
      - rollback safety
  "payments/**":
    check:
      - money rounding
      - duplicate transactions
      - idempotency
      - authorization
    check:
      - authentication bypass
      - token validation
      - authorization
      - permission checking
      - session handling
  "database/**":
    check:
      - unsafe queries
      - transaction handling
      - migration safety
      - rollback safety
  "**/migrations/**":
    check:
      - unsafe queries
      - transaction handling
      - migration safety
      - rollback safety
  "payments/**":
    check:
      - money rounding
      - duplicate transactions
      - idempotency
      - authorization

project_rules:
  - "A pull request that changes apps/<name> must not change any other app, package, or file outside that folder."
  - "A pull request that changes packages/<name> must not change any other package, app, or file outside that folder."
  - "Review only the provided diff and the direct effect of those edits."
  - "Do not suggest refactors, new architecture, extra modules, or unrelated cleanup."
  - "Controllers must not access the database directly."
  - "Every endpoint must verify authorization."
  - "Internal IDs must not be exposed through public APIs."

automation:
  mode: review_only
  allowed_actions:
    - read_pr
    - read_diff
    - post_review
    - add_labels
    - recommend_merge
    - request_human_review
  forbidden_actions:
    - merge_pr
    - approve_pr
    - close_pr
    - push_code
    - modify_repository
