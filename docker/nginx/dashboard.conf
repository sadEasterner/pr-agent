server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_buffering on;
        gzip off;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location /ready {
        proxy_pass http://api:8000/ready;
    }

    location /webhooks/ {
        proxy_pass http://api:8000/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Gitea-Event $http_x_gitea_event;
        proxy_set_header X-Gitea-Delivery $http_x_gitea_delivery;
        proxy_set_header X-Gitea-Signature $http_x_gitea_signature;
        proxy_set_header X-Hub-Signature $http_x_hub_signature;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
        proxy_set_header X-Gitlab-Event $http_x_gitlab_event;
        proxy_set_header X-Gitlab-Token $http_x_gitlab_token;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
