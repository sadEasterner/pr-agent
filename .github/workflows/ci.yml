name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --all-extras
      - run: pnpm nx affected -t lint --base=origin/main
      - run: pnpm nx affected -t typecheck --base=origin/main
      - run: pnpm nx affected -t test --base=origin/main
      - run: pnpm nx affected -t build --base=origin/main
