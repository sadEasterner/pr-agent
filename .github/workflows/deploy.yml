name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$HOST" || { echo "Missing secret DEPLOY_HOST"; exit 1; }
          test -n "$USER" || { echo "Missing secret DEPLOY_USER"; exit 1; }
          test -n "$KEY" || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/deploy_known_hosts
          sparse-checkout-cone-mode: false

      - name: SSH and run locked deploy command
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          cp .github/deploy_known_hosts "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            "$USER@$HOST" /usr/local/bin/pr-manager-deploy
