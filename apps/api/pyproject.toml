[project]
name = "pr-manager-api"
version = "1.0.0"
description = "FastAPI PR manager and AI code-review service for Gitea, GitHub, GitLab, and Forgejo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
    "structlog>=25.4.0",
    "fpdf2>=2.8.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "types-pyyaml>=6.0.12",
    "aiosqlite>=0.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["structlog.*", "fpdf", "fpdf.*"]
ignore_missing_imports = true
