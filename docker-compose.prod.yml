name: pr-manager

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prmanager}
      POSTGRES_DB: ${POSTGRES_DB:-prmanager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prmanager} -d ${POSTGRES_DB:-prmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pr-mangement-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prmanager}:${POSTGRES_PASSWORD:-prmanager}@postgres:5432/${POSTGRES_DB:-prmanager}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_ENV: production
    ports:
      - "127.0.0.1:8110:8000"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: pr-mangement-dashboard:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8111:8080"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
