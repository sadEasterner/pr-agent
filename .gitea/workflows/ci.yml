name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --all-extras --frozen
      - run: pnpm nx run api:lint
      - run: pnpm nx run api:test
      - run: pnpm nx run dashboard:lint
      - run: pnpm nx run dashboard:typecheck
      - run: pnpm nx run dashboard:test
      - run: pnpm nx run dashboard:build
